<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Town</title>
    <script>
      // Apply the saved theme before first paint — React sets this same
      // attribute on mount, but not before the browser has painted the page.
      try {
        var t = JSON.parse(localStorage.getItem("agentTown:theme") || '"dark"');
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {
        console.warn("could not restore saved theme:", e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
